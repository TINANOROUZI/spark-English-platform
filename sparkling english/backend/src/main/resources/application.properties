spring.application.name=spark-english-kids-backend
server.port=8080

# --- Database (PostgreSQL) ---
# Create the database first: createdb spark_english_kids
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spark_english_kids}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# CHANGE app.jwt.secret before deploying anywhere real. Must be >= 32 bytes.
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-please-01234567890123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Default admin account (seeded on first startup if it doesn't exist yet) ---
# CHANGE app.admin.password before deploying anywhere real.
app.admin.name=${ADMIN_NAME:Tina}
app.admin.email=${ADMIN_EMAIL:admin@sparkenglishkids.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# --- CORS: origins allowed to call this API from the browser ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
